<!DOCTYPE html>
<html>

<head>
    <title>Image Gallery</title>

    <style type="text/css">

        /* Global Reset */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            width: 100vw;
            height: 100vh;
            background-color: #eee;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Main Gallery */
        #main {
            background-color: #fff;
            width: 90%;
            max-width: 800px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Heading */
        #heading {
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Gallery */
        .main-images {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* Gallery Images */
        .main-img {
            flex-basis: calc(50% - 8px);
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .main-img:hover {
            transform: scale(1.02);
        }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(20, 20, 20, 0.646);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Image */
        #modalImg {
            width: 580px;
            height: 670px;
            object-fit: contain;
            border: 4px solid bisque;
            border-radius: 4px;
            box-shadow: 2px 4px 10px rgba(114, 91, 62, 0.411);
        }

        /* Close Button */
        #crossbtn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            background: none;
            border: none;
            font-size: 36px;
            cursor: pointer;
            line-height: 1;
        }

        #crossbtn:hover {
            color: rgb(10, 150, 210);
        }

    </style>
</head>

<body>

    <div id="main">

        <h1 id="heading">Picture Gallery</h1>

        <div class="main-images">

            <img src="images/1.jpg" class="main-img" alt="Image 1">
            <img src="images/2.jpg" class="main-img" alt="Image 2">
            <img src="images/3.jpg" class="main-img" alt="Image 3">
            <img src="images/4.jpg" class="main-img" alt="Image 4">

        </div>

    </div>

    <!-- Modal -->
    <div id="modal">

        <img id="modalImg" alt="Selected Image">

        <button id="crossbtn">&times;</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
